[package]
name = "nasu"
version = "0.1.0"
authors = ["Esteban Borai <estebanborai@gmail.com>", "David Camperos"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
license = "MIT"
description = "Command-line utility which poll on remote addresses in order to perform status checks periodically"
readme = "README.md"
repository = "https://github.com/EstebanBorai/nasu"
categories = ["asynchronous", "command-line-utilities", "development-tools", "web-programming"]

[lib]
name = "libnasu"
path = "src/lib/lib.rs"

[[bin]]
name = "nasu"
path = "src/bin/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
bytes = "1"
chrono = "0.4"
cron = "0.17"
futures = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-tls = "0.6"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
url = "2"

[dev-dependencies]
tokio-test = "0.4.6"
